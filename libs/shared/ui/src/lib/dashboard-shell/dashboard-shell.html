<a class="skip-link" href="#main-content">Skip to main content</a>
<aside
  class="sidebar"
  [class.open]="menuOpen()"
  aria-label="Workspace navigation"
  id="workspace-navigation"
>
  <a class="brand" routerLink="/dashboard"
    ><span class="brand-icon" aria-hidden="true"
      ><app-dashboard-icon name="build" /></span
    ><span>GarageCare<small>AUTOMOTIVE OS</small></span></a
  >
  <div class="garage">
    <app-dashboard-icon name="garage" />
    <div><strong>{{ garageName() }}</strong><small>Single garage</small></div>
  </div>
  <nav aria-label="Main navigation">
    @for (item of navigation; track item; let i = $index) {
    <button
      type="button"
      [class.active]="item === page()"
      [attr.aria-current]="item === page() ? 'page' : null"
      [routerLink]="!previewMode() && i < 2 ? (i === 0 ? '/dashboard' : '/service-jobs') : null"
      (click)="item === page() || (!previewMode() && i < 2) ? menuOpen.set(false) : preview(item)"
    >
      <span class="nav-icon" aria-hidden="true"
        ><app-dashboard-icon [name]="navigationIcons[i]" /></span
      >{{ item }}
    </button>
    }
  </nav>
  <div class="account">
    <span class="avatar">AA</span>
    <div>
      <strong>{{ garageName() }}</strong><small>{{ ownerName() }}</small>
    </div>
    <button
      type="button"
      [disabled]="busy()"
      (click)="logout.emit()"
      aria-label="Sign out"
    >
      <app-dashboard-icon name="logout" />
    </button>
  </div>
</aside>
<header class="topbar">
  <button
    class="menu-toggle"
    type="button"
    aria-controls="workspace-navigation"
    [attr.aria-expanded]="menuOpen()"
    (click)="menuOpen.set(!menuOpen())"
  >
    <app-dashboard-icon name="menu" />
    <span class="sr-only">Toggle navigation</span>
  </button>
  <div class="breadcrumb">
    Workspace <app-dashboard-icon name="chevron_right" />
    <strong>{{ page() }}</strong>
  </div>
  <label class="search"
    ><app-dashboard-icon name="search" /><input
      type="search"
      [formControl]="search()"
      placeholder="Search vehicle, customer, job card #..."
      aria-label="Search loaded service jobs"
  /></label>
  <button
    class="icon-button"
    type="button"
    aria-label="Help"
    (click)="preview('Help')"
  >
    <app-dashboard-icon name="help_outline" />
  </button>
  <button
    class="icon-button"
    type="button"
    aria-label="View reminder summary"
    (click)="preview('Reminder notifications')"
  >
    <app-dashboard-icon name="notifications" />
  </button>
  <span class="avatar small-avatar" [attr.aria-label]="ownerName()"
    ><app-dashboard-icon name="person"
  /></span>
</header>
