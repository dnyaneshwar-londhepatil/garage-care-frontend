<a class="skip-link" href="#main-content">Skip to main content</a>
<aside
  class="sidebar"
  [class.open]="menuOpen()"
  aria-label="Workspace navigation"
  id="workspace-navigation"
>
  <a
    class="brand"
    [routerLink]="previewMode() ? '/preview/dashboard' : '/dashboard'"
    ><span class="brand-icon" aria-hidden="true"
      ><app-dashboard-icon name="build" /></span
    ><span>GarageCare<small>Garage workspace</small></span></a
  >
  <div class="garage">
    <app-dashboard-icon name="garage" />
    <div><strong>{{ garageName() }}</strong></div>
  </div>
  <nav aria-label="Main navigation">
    @for (item of navigation; track item; let i = $index) {
    <button
      type="button"
      [class.active]="item === page()"
      [attr.aria-current]="item === page() ? 'page' : null"
      [routerLink]="(previewMode() ? '/preview' : '') + navigationPaths[i]"
      (click)="menuOpen.set(false)"
    >
      <span class="nav-icon" aria-hidden="true"
        ><app-dashboard-icon [name]="navigationIcons[i]" /></span
      >{{ item }}
    </button>
    }
  </nav>
  <div class="account">
    <span class="avatar" aria-hidden="true"
      ><app-dashboard-icon name="person"
    /></span>
    <div>
      <strong>{{ garageName() }}</strong><small>{{ ownerName() }}</small>
    </div>
    <button
      type="button"
      [disabled]="busy()"
      (click)="logout.emit()"
      aria-label="Sign out"
    >
      <app-dashboard-icon name="logout" />
    </button>
  </div>
</aside>
<header class="topbar">
  <button
    class="menu-toggle"
    type="button"
    aria-controls="workspace-navigation"
    [attr.aria-expanded]="menuOpen()"
    (click)="menuOpen.set(!menuOpen())"
  >
    <app-dashboard-icon name="menu" />
    <span class="sr-only">Toggle navigation</span>
  </button>
  <div class="breadcrumb">
    Workspace <app-dashboard-icon name="chevron_right" />
    <strong>{{ page() }}</strong>
  </div>
  @if (page() === 'Dashboard') {<label class="search"
    ><app-dashboard-icon name="search" /><input
      type="search"
      [formControl]="search()"
      placeholder="Search customer or vehicle…"
      aria-label="Search loaded service jobs"
  /></label>
  }<span class="avatar small-avatar" [attr.aria-label]="ownerName()"
    ><app-dashboard-icon name="person"
  /></span>
</header>
